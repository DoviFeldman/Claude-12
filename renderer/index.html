<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>Finder Viewer</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="titlebar">
    <div class="nav-group">
      <button id="btn-back" class="tb-btn" title="Back">&#x2039;</button>
      <button id="btn-forward" class="tb-btn" title="Forward">&#x203A;</button>
    </div>
    <div id="folder-title">Downloads</div>
    <div class="tb-spacer"></div>
    <div class="segmented" id="group-toggle" title="Group files by day or month">
      <button data-group="day" class="active">Days</button>
      <button data-group="month">Months</button>
    </div>
    <div class="segmented" id="view-toggle" title="Grid or big scrolling feed">
      <button data-view="grid" class="active" title="Grid view">
        <svg width="14" height="14" viewBox="0 0 14 14"><rect x="0" y="0" width="6" height="6" rx="1.4"/><rect x="8" y="0" width="6" height="6" rx="1.4"/><rect x="0" y="8" width="6" height="6" rx="1.4"/><rect x="8" y="8" width="6" height="6" rx="1.4"/></svg>
      </button>
      <button data-view="feed" title="Feed view (big, Instagram-style scroll)">
        <svg width="14" height="14" viewBox="0 0 14 14"><rect x="1" y="0" width="12" height="6" rx="1.4"/><rect x="1" y="8" width="12" height="6" rx="1.4"/></svg>
      </button>
    </div>
  </div>

  <div id="main">
    <aside id="sidebar">
      <div class="sb-section-title">Favorites</div>
      <div id="sb-places"></div>
      <div class="sb-section-title" id="sb-fav-title" style="display:none">Added</div>
      <div id="sb-favorites"></div>
      <div id="sb-drophint">Drag files or folders here to add them</div>
    </aside>

    <div id="content" tabindex="0">
      <div id="sections"></div>
      <div id="empty-msg" style="display:none">This folder is empty</div>
    </div>
  </div>

  <div id="statusbar"><span id="status-text"></span></div>

  <!-- Context menu -->
  <div id="ctxmenu" style="display:none"></div>

  <!-- Quick Look overlay -->
  <div id="quicklook" style="display:none">
    <div id="ql-panel">
      <div id="ql-header">
        <button id="ql-close" title="Close (Esc)">&#x2715;</button>
        <div id="ql-title"></div>
        <div id="ql-counter"></div>
        <button id="ql-open" title="Open with default app">Open</button>
      </div>
      <div id="ql-body"></div>
      <div id="ql-caption"></div>
    </div>
  </div>

  <!-- three.js (UMD builds) for STL / 3MF preview; app degrades gracefully if missing -->
  <script src="../node_modules/three/build/three.min.js"></script>
  <script src="../node_modules/three/examples/js/libs/fflate.min.js"></script>
  <script src="../node_modules/three/examples/js/loaders/STLLoader.js"></script>
  <script src="../node_modules/three/examples/js/loaders/3MFLoader.js"></script>
  <script src="../node_modules/three/examples/js/controls/OrbitControls.js"></script>
  <script src="app.js"></script>
</body>
</html>
