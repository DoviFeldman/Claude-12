name: Build macOS app

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - claude/macos-finder-viewer-electron-03uyrh
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (dmg + zip, universal)
        run: npx electron-builder --mac --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Smoke test packaged app
        run: |
          set -x
          APP_DIR=$(find dist -maxdepth 2 -name '*.app' | head -1)
          BIN="$APP_DIR/Contents/MacOS/$(basename "$APP_DIR" .app)"
          echo "Launching: $BIN"
          "$BIN" --smoke-test 2>&1 | tee smoke.log
          exit "${PIPESTATUS[0]}"

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Finder-Viewer-mac
          path: |
            dist/*.dmg
            dist/*.zip

      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.dmg
            dist/*.zip

      - name: Publish rolling "Latest Build" release
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest Build
          prerelease: true
          body: |
            Automatic build of the most recent commit (${{ github.sha }}).

            **Download `Finder-Viewer-mac.dmg`**, open it, and drag Finder Viewer into Applications.
            The app is unsigned — the first time, right-click the app and choose **Open**.
            If macOS claims the app is "damaged", run:
            `xattr -cr "/Applications/Finder Viewer.app"`
          files: |
            dist/*.dmg
            dist/*.zip

      - name: Prune stale assets from rolling release
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/github-script@v7
        with:
          script: |
            const keep = new Set(['Finder-Viewer-mac.dmg', 'Finder-Viewer-mac.zip']);
            const { data: release } = await github.rest.repos.getReleaseByTag({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag: 'latest'
            });
            for (const asset of release.assets) {
              if (!keep.has(asset.name)) {
                core.info(`Deleting stale asset: ${asset.name}`);
                await github.rest.repos.deleteReleaseAsset({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  asset_id: asset.id
                });
              }
            }
